name: Deploy to Production (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Quality gate: nothing reaches the FTP step unless tests + build pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # phpunit.dist.xml declares a <coverage> block and sets
          # failOnWarning="true" - with no driver, PHPUnit emits a "no code
          # coverage driver available" warning that fails the whole run even
          # though every test passes. pcov is the fastest option to satisfy it.
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Run PHPUnit
        run: composer test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: /public_html/
          # dangerous-clean-slate is deliberately left at its default (false):
          # a "true" here mirrors the local build exactly, deleting anything on
          # the server not present locally - that would wipe writable/ runtime
          # state and any file uploaded directly on the host outside git.
          # Because of that, public/assets/uploads/** is intentionally NOT
          # excluded below: with clean-slate off, this action only adds/updates
          # files present locally, it never deletes server-only ones - so
          # images already committed to the repo deploy normally, and any
          # image uploaded straight to production (not in git) is left alone.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules/**/*
            .github/**
            .github/**/*
            .claude/**
            .claude/**/*
            tests/**
            tests/**/*
            .env
            writable/**
            writable/**/*
